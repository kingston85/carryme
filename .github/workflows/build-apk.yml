name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files (first build only)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org lr.carryme --project-name carryme .
          fi
          python3 tool/patch_android.py

      # Firebase settings come from the GOOGLE_SERVICES_JSON secret.
      # Without it the app is built in demo mode.
      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
            python3 tool/gen_firebase_options.py "$RUNNER_TEMP/google-services.json"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set - building in DEMO mode."
          fi

      # The same signing key every build, so Firebase phone sign-in keeps
      # working and new APKs install over old ones.
      - name: Install signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the CarryMe signing key from secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - a random key is used, so phone sign-in will not work."
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Show signing fingerprints (add these in Firebase)
        run: |
          if [ -f ~/.android/debug.keystore ]; then
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarryMe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
